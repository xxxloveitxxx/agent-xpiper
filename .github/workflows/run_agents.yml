name: 🚀 Run Agent Xpiper

on:
  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      max_agents:
        description: "Max agents to scrape (overrides criteria.json)"
        required: false
        default: ""

  # Auto-trigger when criteria changes
  push:
    paths:
      - "config/criteria.json"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write  # needed to commit CSV results back

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Patch max_agents if provided
        if: ${{ github.event.inputs.max_agents != '' }}
        run: |
          python - <<'EOF'
          import json, os
          with open("config/criteria.json") as f:
              c = json.load(f)
          c.setdefault("scraping_config", {})["max_agents"] = int("${{ github.event.inputs.max_agents }}")
          with open("config/criteria.json", "w") as f:
              json.dump(c, f, indent=2)
          print(f"max_agents set to ${{ github.event.inputs.max_agents }}")
          EOF

      - name: Run Agent Xpiper
        env:
          GROQ_API_KEY_MANAGER: ${{ secrets.GROQ_API_KEY_MANAGER }}
          GROQ_API_KEY_SCRAPER: ${{ secrets.GROQ_API_KEY_SCRAPER }}
          GROQ_API_KEY_QUALIFIER: ${{ secrets.GROQ_API_KEY_QUALIFIER }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python main.py

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-leads-${{ github.run_number }}
          path: data/leads/qualified_leads_*.csv
          retention-days: 90

      - name: Commit results back to repo
        if: success()
        run: |
          git config user.name  "Agent Xpiper Bot"
          git config user.email "bot@agent-xpiper.local"
          git add data/leads/ || true
          git diff --staged --quiet || git commit -m "🎯 Leads: $(date +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push || true
